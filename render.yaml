services:
  - name: echo-time-aware-api
    type: web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev --workspaces=false
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: ECHO_PUBLIC_DEMO
        value: "true"
      - key: ECHO_LLM_PROVIDER
        value: groq
      - key: ECHO_BROWSER_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ECHO_DATABASE_URL
        fromDatabase:
          name: echo-time-aware-db
          property: connectionString

databases:
  - name: echo-time-aware-db
    region: oregon
    plan: free
    ipAllowList: []
